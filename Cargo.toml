[workspace]
resolver = "2"
members = [
    "engine/core",
    "engine/sim",
    "engine/render",
    "engine/tools",
    "game/rules",
    "game/app",
    "game/tools",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Todas las versiones de dependencias se fijan aquí, una sola vez.
# Un crate las usa con `nombre.workspace = true`.
[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.19"

# Lints compartidos. Cada crate los hereda con `[lints] workspace = true`.
# `unsafe_code` queda en `deny` para que `engine_render` pueda permitirlo
# en su raíz; todos los demás crates lo suben a `forbid` (regla 3).
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# La documentación está en español y menciona siglas como SoA o glTF;
# este lint pedante las marcaría una por una.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
