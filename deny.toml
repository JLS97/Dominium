# Configuración de cargo-deny. Se ejecuta con `cargo deny check`.

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Los crates del propio workspace no se publican y no necesitan licencia.
private = { ignore = true }
# La lista de arriba se adelanta a las dependencias que traerán los hitos;
# no avisar por las que todavía no aparecen.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Q-014 (CA-24 de specs/architecture/engine_core.md): las features de `glam` y
# `rustc-hash` quedan fijadas con `exact = true` a las que el workspace activa
# hoy, confirmadas con `cargo tree -p engine_core -e features` el 31 de octubre
# de 2026. Cargo unifica features: si otro crate declarase `glam` con
# `scalar-math` o `libm`, o `rustc-hash` con `rand`, cambiaría los resultados
# en flotante o metería tipos con estado aleatorio en el único `glam` o
# `rustc-hash` del grafo, y la simulación dejaría de ser determinista sin que
# `clippy.toml` ni `check-arch` lo vieran. Una feature nueva de estos dos
# crates entra solo por una tarea de contrato que cambie esta lista y la spec
# de quien la pida. Las listas son el conjunto resuelto completo, con las
# features implícitas que `default` arrastra, porque es lo que compara
# cargo-deny.
features = [
    { crate = "glam", exact = true, allow = [
        "all-types",
        "bytemuck",
        "default",
        "f64",
        "float-types",
        "i16",
        "i32",
        "i64",
        "i8",
        "integer-types",
        "isize",
        "serde",
        "size-types",
        "std",
        "u16",
        "u32",
        "u64",
        "u8",
        "usize",
    ] },
    { crate = "rustc-hash", exact = true, allow = ["default", "std"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
