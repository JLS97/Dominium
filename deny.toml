# Configuración de cargo-deny. Se ejecuta con `cargo deny check`.

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Los crates del propio workspace no se publican y no necesitan licencia.
private = { ignore = true }
# La lista de arriba se adelanta a las dependencias que traerán los hitos;
# no avisar por las que todavía no aparecen.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
